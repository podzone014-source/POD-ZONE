<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IGNITE V80 - PodZone</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* CABEÇALHO */

header {
    text-align: center;
    padding: 20px 15px 10px;
}

.logo {
    width: 125px;
    display: block;
    margin: 0 auto;
}

/* PRODUTO */

.produto {
    width: 100%;
    max-width: 480px;
    margin: 20px auto 0;
    padding: 0 20px;
}

/* IMAGEM */

.imagem-produto {
    width: 100%;
    height: 360px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
}

/* NOME */

h1 {
    margin: 15px 0 5px;
    font-size: 30px;
    color: #d4af37;
    letter-spacing: 1px;
}

/* PREÇO */

.preco {
    margin: 0 0 20px;
    font-size: 25px;
    font-weight: bold;
    color: #fff;
}

/* DESCRIÇÃO */

.descricao {
    color: #bbb;
    font-size: 14px;
    line-height: 1.6;
    margin: 0 auto 25px;
}

/* BOTÕES */

.botoes {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.botao {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    transition: 0.2s;
}

/* WHATSAPP */

.whatsapp {
    background: linear-gradient(
        135deg,
        #d4af37,
        #f5d76e
    );

    color: #000;
    border: none;
}

.whatsapp:active {
    transform: scale(0.98);
}

/* VOLTAR */

.voltar {
    background: #111;
    color: #fff;
    border: 1px solid #333;
}

/* BENEFÍCIOS */

.beneficios {
    margin: 35px 0 10px;
    padding: 20px 15px;
    border-top: 1px solid #222;
    border-bottom: 1px solid #222;
}

.beneficio {
    margin: 12px 0;
    color: #ccc;
    font-size: 13px;
}

/* RODAPÉ */

footer {
    text-align: center;
    padding: 25px 15px 35px;
    color: #777;
    font-size: 12px;
}

/* DESKTOP */

@media (min-width: 700px) {

    .produto {
        max-width: 850px;
    }

    .imagem-produto {
        height: 430px;
    }

    h1 {
        font-size: 36px;
    }

}

</style>

</head>

<body>


<header>

<a href="index.html">

<img
src="0C425A9F-032A-4798-B3DF-47E8A5E23C3A.png"
class="logo"
alt="POD ZONE">

</a>

</header>


<main class="produto">


<img
src="FEE94CF7-D277-4C39-93B1-54827C90ADE1.png"
class="imagem-produto"
alt="IGNITE V80">


<h1>IGNITE V80</h1>


<div class="preco">
R$ 75,00
</div>


<p class="descricao">

Confira as informações do IGNITE V80 e entre em contato
com a POD ZONE pelo WhatsApp para tirar suas dúvidas.

</p>


<div class="botoes">

<a
class="botao whatsapp"
href="#"
onclick="contatoWhatsApp(); return false;">

Falar pelo WhatsApp

</a>


<a
class="botao voltar"
href="index.html">

← Voltar para produtos

</a>

</div>


<section class="beneficios">

<div class="beneficio">
✓ Produto original
</div>

<div class="beneficio">
🚚 Envio rápido
</div>

<div class="beneficio">
📲 Atendimento via WhatsApp
</div>

</section>


</main>


<footer>

© 2026 PodZone

</footer>


<script>

function contatoWhatsApp() {

    const produto = "IGNITE V80";

    const mensagem =
        "Olá, vim pelo site da POD ZONE e gostaria de saber mais sobre o produto " 
        + produto + ".";

    const link =
        "https://wa.me/5511993554907?text="
        + encodeURIComponent(mensagem);

    window.open(link, "_blank");

}

</script>


</body>

</html>
