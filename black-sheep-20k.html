<!DOCTYPE html>
<html lang="pt-BR">

/* =========================

========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   LOGO
========================= */

.logo-link {
    display: block;
    text-align: center;
}

.logo {
    width: 150px;
    margin-top: 25px;
    cursor: pointer;
}


/* =========================
   PRODUTO
========================= */

.produto {

    max-width: 900px;
    margin: 30px auto 0;
    padding: 0 20px;
}


/* =========================
   IMAGEM DO PRODUTO

========================= */

.imagem-box {
    width: 100%;
    height: 510px;

    border: none;
    border-radius: 0;

    background:

            circle,
            rgba(212,175,55,.20),

        ),
        #050505;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    padding: 0;
}

.imagem-box img {
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    position: relative;
    z-index: 2;
}


/* =========================
   INFORMAÇÕES
========================= */

.info {
    text-align: center;
    padding-top: 25px;
}

.badge {
    display: inline-block;

    padding: 6px 14px;

    border: 1px solid #d4af37;
    border-radius: 20px;

    color: #d4af37;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 12px;

h1 {
    color: #fff;

.preco {
    color: #d4af37;

.puffs {

    margin-bottom: 25px;
}

   ESCOLHER SABOR
========================= */

.sabor-titulo {
    color: #fff;

    font-size: 15px;
    font-weight: bold;

    margin-bottom: 10px;
}

select {
    width: 80%;
    max-width: 400px;

    padding: 14px;

    background: #111;
    color: #fff;

    border: 2px solid #d4af37;
    border-radius: 12px;

    font-size: 16px;
    font-weight: bold;

    outline: none;
    cursor: pointer;

    transition: .3s;

    margin-bottom: 20px;
}

select:focus {
    border-color: #f5d76e;

    box-shadow:
        0 0 12px
        rgba(212,175,55,.6);
}


/* =========================
   BOTÕES
========================= */

.botoes {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

.botao {
    display: inline-block;

    padding: 15px 25px;

    border-radius: 10px;

    text-decoration: none;

    font-weight: bold;

    transition: .3s;
}

.whatsapp {
    background:
        linear-gradient(
            135deg,
            #d4af37,
            #eeeeee
        );

    color: #000;
}

.whatsapp:hover {
    transform: translateY(-2px);

    box-shadow:
        0 5px 20px
        rgba(212,175,55,.25);
}

.voltar {
    background: #222;

    color: #fff;

    border: 1px solid #444;
}

.voltar:hover {
    background: #2b2b2b;
}


/* =========================
   FOOTER
========================= */

footer {

    padding: 40px 20px 30px;

    color: #777;

    font-size: 13px;

   RESPONSIVO
========================= */

        background:
            radial-gradient(

                rgba(212,175,55,.20),
                transparent 45%

            #050505;
    }

    .imagem-box img {
        width: 100%;
        height: 100%;

        object-fit: contain;
    }

    .info {
        padding-top: 20px;
    }

    h1 {
        font-size: 28px;
    }

    .preco {
        font-size: 26px;
    }

    select {
        width: 90%;
    }

    .botao {
        padding: 14px 20px;
    }

}


/* =========================
   TELAS MUITO PEQUENAS
========================= */

@media (max-width: 380px) {

    .imagem-box {
        height: 350px;
    }

    h1 {

    }
